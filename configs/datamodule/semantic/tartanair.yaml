# @package datamodule
defaults:
  - /datamodule/semantic/default.yaml

_target_: src.datamodules.tartanair.TartanAirDataModule

dataloader:
    batch_size: 1

# Metadata for TartanAir (10 coarse classes)
num_classes: 10
stuff_classes: [0, 1, 2, 4, 5]  # ground, vegetation, sky, road, water
fold: null
trainval: False
val_on_test: False
xy_tiling: null
in_memory: False

# Point features used for partition
partition_hf:
  - 'rgb'
  - 'linearity'
  - 'planarity'
  - 'scattering'
  - 'verticality'
  - 'elevation'

# Point features used for training
point_hf:
  - 'linearity'
  - 'planarity'
  - 'scattering'
  - 'verticality'
  - 'elevation'
  - 'rgb'

# Segment-wise features computed at preprocessing
segment_base_hf: []
segment_mean_hf: []
segment_std_hf: []

# Edge features
edge_hf:
  - 'mean_off'
  - 'std_off'
  - 'mean_dist'
  - 'angle_source'
  - 'angle_target'
  - 'centroid_dir'
  - 'centroid_dist'
  - 'normal_angle'
  - 'log_length'
  - 'log_surface'
  - 'log_volume'
  - 'log_size'

v_edge_hf: []

voxel: 0.05
knn: 45
knn_r: 2
knn_step: -1
knn_min_search: 25
ground_model: 'ransac'
ground_threshold: 1.5
ground_xy_grid: 1
ground_scale: 4.0
pcp_regularization: [0.01, 0.1, 0.5]
pcp_spatial_weight: [1e-1, 1e-1, 1e-1]
pcp_cutoff: [10, 10, 10]
pcp_edge_reduce: 'mean'
pcp_k_adjacency: 10
pcp_w_adjacency: 1
pcp_iterations: 15
graph_k_min: 1
graph_k_max: 30
graph_gap: [0.2, 0.5, 1]
graph_se_ratio: 0.3
graph_se_min: 20
graph_cycles: 3
graph_margin: 0.2
graph_chunk: [1e6, 1e5, 1e5]

sample_segment_ratio: 0.1
sample_segment_by_size: True
sample_segment_by_class: False
sample_point_min: 32
sample_point_max: 128
sample_graph_r: 7
sample_graph_k: 4
sample_graph_max_nodes: 10000
sample_graph_disjoint: True
sample_graph_cylindrical: False
sample_edge_n_min: -1
sample_edge_n_max: -1

pos_jitter: 0.03
tilt_n_rotate_phi: 0.1
tilt_n_rotate_theta: 180
anisotropic_scaling: 0.2
rgb_jitter: 0
rgb_autocontrast: 0.5
rgb_drop: 0.3
node_feat_jitter: 0.01
h_edge_feat_jitter: 0.01
v_edge_feat_jitter: 0
node_feat_drop: 0.3
h_edge_feat_drop: 0
v_edge_feat_drop: 0
node_row_drop: 0
h_edge_row_drop: 0
v_edge_row_drop: 0
drop_to_mean: False
