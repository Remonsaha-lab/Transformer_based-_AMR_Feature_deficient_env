# @package _global_
# Phase 3 Baseline Model Experiment Configuration

defaults:
  - /model/semantic/spt-3.yaml
  - /model/semantic/_point_cnn.yaml
  - /experiment/semantic/default_ezsp.yaml
  - override /datamodule: semantic/diode_ezsp.yaml
  - override /trainer: gpu.yaml

datamodule:
  num_classes: 10
  taxonomy_mode: amr10
  split_manifest_dir: active_learning/splits
  train_on_val: false

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 5
  precision: 16-mixed

model:
  freeze_cnn: true
  gc_every_n_steps: 1
  optimizer:
    lr: 0.01
    weight_decay: 1e-2
  scheduler:
    num_warmup: 5

logger:
  wandb:
    project: diode_baselines
    name: ezsp-amr10-baseline
    offline: true

