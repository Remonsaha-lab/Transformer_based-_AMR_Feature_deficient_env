# @package _global_

defaults:
  - /model/semantic/spt-3.yaml # SPT on 3 superpoint partition levels
  - /model/semantic/_point_cnn.yaml # EZ-SP uses a CNN in the first stage
  - /experiment/semantic/default_ezsp.yaml
  - override /datamodule: semantic/tartanair_ezsp.yaml
  - override /trainer: gpu.yaml

trainer:
  max_epochs: 1000

model:
  optimizer:
    lr: 0.05
    weight_decay: 1e-2

logger:
  wandb:
    project: tartanair_ezsp
    name: semantic-ezsp
