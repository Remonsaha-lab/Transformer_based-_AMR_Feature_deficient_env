# @package _global_

defaults:
  - override /datamodule: semantic/tartanair.yaml
  - override /model: semantic/spt-2.yaml
  - override /trainer: gpu.yaml

# parameters below will be merged with parameters from default configurations set above
datamodule:
  xy_tiling: 3  # split each cloud into xy_tiling^2=9 tiles to save GPU VRAM
  sample_graph_k: 2  # 2 spherical samples in each batch instead of 4 to save VRAM

callbacks:
  gradient_accumulator:
    scheduling:
      0:
        2  # accumulate gradient every 2 batches to make up for reduced batch size

trainer:
  max_epochs: 500

model:
  optimizer:
    lr: 0.1
    weight_decay: 1e-2

logger:
  wandb:
    project: "spt_tartanair"
    name: "SPT-11G-baseline"
