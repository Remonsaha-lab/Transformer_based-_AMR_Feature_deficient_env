# @package _global_
# Phase 3 Baseline 6: EZ-SP with Geometry Only (No RGB radiometric features)

defaults:
  - /model/semantic/spt-3.yaml
  - /model/semantic/_point_cnn.yaml
  - /experiment/semantic/default_ezsp.yaml
  - override /datamodule: semantic/diode_ezsp.yaml
  - override /trainer: gpu.yaml

datamodule:
  num_classes: 10
  taxonomy_mode: amr10
  split_manifest_dir: active_learning/splits
  train_on_val: false
  partition_hf: []
  post_cnn_point_hf:
    - 'elevation'

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 5

model:
  optimizer:
    lr: 0.01
    weight_decay: 1e-2

logger:
  wandb:
    project: diode_baselines
    name: ezsp-amr10-geometry-only

